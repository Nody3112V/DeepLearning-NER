# Cấu hình nhánh 2: Pretrained Language Models - PhoBERT & XLM-R (Phụ trách: Thành viên 2)
experiment_name: "phobert_base_vlsp_word"
seed: 42

data:
  dataset: "vlsp"              # "vlsp" hoặc "phoner_covid19"
  granularity: "word"          # "word" hoặc "syllable"
  train_path: "data/processed/vlsp/word/train.jsonl"
  dev_path: "data/processed/vlsp/word/dev.jsonl"
  test_path: "data/processed/vlsp/word/test.jsonl"
  test_indices_path: "data/splits/test_indices.json"
  max_seq_len: 256

model:
  # Backbone PLM: "vinai/phobert-base-v2" hoặc "xlm-roberta-base"
  model_name_or_path: "vinai/phobert-base-v2"
  num_labels: 9               # O, B-PER, I-PER, B-LOC, I-LOC, B-ORG, I-ORG, B-MISC, I-MISC
  
  # Chiến lược kết hợp các tầng ẩn cuối (Ablation ở Tuần 4):
  # "last"      : Lấy tầng ẩn cuối cùng (chuẩn)
  # "concat_4"  : Ghép nối 4 tầng ẩn cuối (4 * hidden_dim)
  # "mean_4"    : Trung bình cộng 4 tầng ẩn cuối
  # "weighted"  : Tổng có trọng số học được của tất cả các tầng
  pooling_strategy: "last"
  
  # Chiến lược đóng băng tham số:
  freeze_embeddings: false
  freeze_encoder_layers: 0    # Số tầng Transformer dưới cùng bị đóng băng (0 = fine-tune toàn bộ)
  classifier_dropout: 0.2

train:
  batch_size: 16
  num_epochs: 10
  
  # Differential Learning Rates
  encoder_lr: 2.0e-5
  classifier_lr: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  
  # Scheduler: "linear", "cosine", "reduce_on_plateau"
  lr_scheduler: "linear"
  grad_clip: 1.0
  early_stopping_patience: 3
  
  # Tối ưu phần cứng theo chuẩn dl-engineer.md
  use_amp: true               # Mixed Precision (torch.amp.autocast + GradScaler)
  num_workers: 2
  pin_memory: true

logging:
  backends: "auto"            # "auto" (W&B nếu có, TB nếu có, local luôn luôn), "wandb", "tensorboard", "local"
  project_name: "vietnamese-ner-acl"
  checkpoint_dir: "outputs/checkpoints/pretrained"
  figure_dir: "outputs/figures/attention"
  prediction_out: "outputs/predictions/pretrained_test.jsonl"
  table_out: "outputs/tables/plm_stats.json"
